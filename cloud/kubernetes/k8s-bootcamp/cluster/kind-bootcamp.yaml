# 3-node kind cluster: 1 control plane, 2 zone-labeled workers.
# bootcamp-worker2 (zone-b, pool=accel) gets the host GPU via nvkind.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bootcamp
networking:
  disableDefaultCNI: true          # Cilium is installed by up.sh
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
- role: control-plane
  image: kindest/node:v1.35.0
  extraPortMappings:               # NodePorts for the Gateway in Block 3
  - { containerPort: 30080, hostPort: 8080, protocol: TCP }
  - { containerPort: 30443, hostPort: 8443, protocol: TCP }
- role: worker
  image: kindest/node:v1.35.0
  labels:
    topology.kubernetes.io/zone: zone-a
    node.bootcamp.io/pool: general
- role: worker
  image: kindest/node:v1.35.0
  labels:
    topology.kubernetes.io/zone: zone-b
    node.bootcamp.io/pool: accel
  extraMounts:
  - hostPath: /dev/null
    containerPath: /var/run/nvidia-container-devices/all
